name: Deploy to S3

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          # aws creds (encoded) - decode before use
          aws-access-key-id: REDACTED_ACCESS_KEY
          aws-secret-access-key: REDACTED_SECRET_KEY
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          aws s3 sync ./public s3://adinkra-assets/shared/reports/ --delete
